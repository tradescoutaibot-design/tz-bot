<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TZ Backtester</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0f; --surface:#111118; --surface2:#18181f; --border:#23232e; --text:#e8e8f0; --muted:#8888a0; --hint:#55556a; --green:#00e5a0; --red:#ff4466; --amber:#ffaa00; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; padding:24px; }
.wrap { max-width:1200px; margin:0 auto; }
h1 { font-size:28px; font-weight:800; margin-bottom:8px; }
.subtitle { color:var(--muted); margin-bottom:24px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
.ct { font-size:10px; font-weight:700; text-transform:uppercase; color:var(--hint); margin-bottom:12px; letter-spacing:0.1em; }
label { font-size:11px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600; text-transform:uppercase; }
input { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'Space Mono',monospace; font-size:12px; }
input:focus { outline:none; border-color:var(--green); }
.btn { padding:10px 20px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:none; background:var(--green); color:#000; font-family:'Syne',sans-serif; }
.btn:hover { opacity:0.9; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
.metric { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; }
.ml { font-size:11px; color:var(--muted); margin-bottom:5px; }
.mv { font-size:22px; font-weight:800; font-family:'Space Mono',monospace; }
.ms { font-size:11px; color:var(--hint); margin-top:3px; }
.up { color:var(--green); } .dn { color:var(--red); } .am { color:var(--amber); }
.table { width:100%; border-collapse:collapse; font-size:11px; margin-top:16px; }
.table th { text-align:left; padding:8px; background:var(--surface2); color:var(--hint); font-size:10px; text-transform:uppercase; border-bottom:1px solid var(--border); }
.table td { padding:8px; border-bottom:1px solid var(--border); font-family:'Space Mono',monospace; }
.table tr:hover td { background:var(--surface2); }
.loading { text-align:center; padding:32px; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top:3px solid var(--green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <h1>TZ Deep Backtester</h1>
  <p class="subtitle">Test all 3 strategies with real Yahoo Finance data</p>

  <div class="card">
    <div class="ct">Configuration</div>
    <div class="grid">
      <div><label>Ticker</label><input type="text" id="ticker" value="SPY"></div>
      <div><label>Start Date</label><input type="date" id="start" value="2023-01-01"></div>
      <div><label>End Date</label><input type="date" id="end" value="2024-12-31"></div>
      <div><label>Capital ($)</label><input type="number" id="capital" value="1000" min="100"></div>
    </div>
    <button class="btn" id="run-btn" onclick="runBacktests()">Run All 3 Strategies</button>
  </div>

  <div id="loading" class="loading" style="display:none">
    <div class="spinner"></div>
    <div id="loading-msg" style="color:var(--muted)">Fetching data...</div>
  </div>

  <div id="results" style="display:none">
    <div class="card">
      <div class="ct">Comparison</div>
      <table class="table">
        <thead><tr><th>Strategy</th><th>Return</th><th>Win Rate</th><th>Sharpe</th><th>Max DD</th><th>Trades</th><th>PF</th></tr></thead>
        <tbody id="comp-table"></tbody>
      </table>
    </div>
    <div id="strats-div"></div>
  </div>
</div>

<script>
async function runBacktests() {
  const ticker = document.getElementById('ticker').value.toUpperCase();
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const capital = parseFloat(document.getElementById('capital').value) || 1000;
  if (!ticker || !start || !end) { alert('Fill all fields'); return; }
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('run-btn').disabled = true;
  try {
    document.getElementById('loading-msg').textContent = 'Fetching ' + ticker + '...';
    const candles = await getYahoo(ticker, start, end);
    if (candles.length < 20) throw new Error('Not enough data');
    const strats = {
      connors: runConnors(candles, capital),
      sma: runSMA(candles, capital),
      orb: runORB(candles, capital)
    };
    const ranked = Object.entries(strats).sort((a, b) => (b[1].sharpe || 0) - (a[1].sharpe || 0)).map(x => x[0]);
    const labels = { connors: 'Connors RSI(2)', sma: 'SMA 9/21', orb: 'ORB' };
    let html = '';
    for (const s of ranked) {
      const r = strats[s];
      html += `<tr><td><strong>${labels[s]}</strong></td><td class="${r.ret >= 0 ? 'up' : 'dn'}">${r.ret >= 0 ? '+' : ''}${r.ret}%</td><td>${r.wr}%</td><td class="${r.sharpe >= 1 ? 'up' : 'am'}">${r.sharpe}</td><td class="dn">-${r.dd}%</td><td>${r.trades}</td><td class="${r.pf >= 1.5 ? 'up' : 'am'}">${r.pf}</td></tr>`;
    }
    document.getElementById('comp-table').innerHTML = html;
    html = '';
    for (const s of ranked) {
      const r = strats[s];
      html += `<div class="card"><h2 style="font-size:16px;margin-bottom:12px">${labels[s]}</h2><div class="grid"><div class="metric"><div class="ml">Return</div><div class="mv ${r.ret >= 0 ? 'up' : 'dn'}">${r.ret >= 0 ? '+' : ''}${r.ret}%</div></div><div class="metric"><div class="ml">Win Rate</div><div class="mv">${r.wr}%</div></div><div class="metric"><div class="ml">Sharpe</div><div class="mv ${r.sharpe >= 1 ? 'up' : 'am'}">${r.sharpe}</div></div><div class="metric"><div class="ml">Drawdown</div><div class="mv dn">-${r.dd}%</div></div><div class="metric"><div class="ml">Trades</div><div class="mv">${r.trades}</div></div><div class="metric"><div class="ml">Profit Factor</div><div class="mv ${r.pf >= 1.5 ? 'up' : 'am'}">${r.pf}</div></div><div class="metric"><div class="ml">Avg Win</div><div class="mv up">$${r.avg_w}</div></div><div class="metric"><div class="ml">Avg Loss</div><div class="mv dn">$${r.avg_l}</div></div></div></div>`;
    }
    document.getElementById('strats-div').innerHTML = html;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  } catch(e) {
    alert('Error: ' + e.message);
    document.getElementById('loading').style.display = 'none';
  } finally {
    document.getElementById('run-btn').disabled = false;
  }
}
async function getYahoo(tick, start, end) {
  const s = Math.floor(new Date(start).getTime() / 1000);
  const e = Math.floor(new Date(end).getTime() / 1000);
  const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${tick}?period1=${s}&period2=${e}&interval=1d`);
  const d = await r.json();
  const c = d.chart.result[0];
  const out = [];
  for (let i = 0; i < c.timestamps.length; i++) {
    if (c.indicators.quote[0].close[i] === null) continue;
    out.push({c: c.indicators.quote[0].close[i], v: c.indicators.quote[0].volume[i] || 0});
  }
  return out;
}
function runConnors(candles, cap) {
  const closes = candles.map(x => x.c);
  const rsi = RSI(closes, 2);
  const ma = SMA(closes, 200);
  let trades = [], cash = cap, pos = null;
  for (let i = 200; i < closes.length; i++) {
    const p = closes[i];
    const r = rsi[i];
    const m = ma[i];
    if (r === null || m === null) continue;
    if (pos && r >= 70) {
      const pnl = (p - pos.e) * pos.q;
      cash += pos.q * p;
      trades.push({ pnl, won: pnl > 0 });
      pos = null;
    }
    if (!pos) {
      let dn = 0;
      for (let j = i - 1; j > i - 5; j--) if (closes[j] < closes[j-1]) dn++;
      if (p > m && r < 10 && dn >= 3) {
        const q = Math.max(1, Math.floor(cash * 0.1 / p));
        if (q * p <= cash) { cash -= q * p; pos = {e: p, q}; }
      }
    }
  }
  if (pos) trades.push({pnl: (closes[closes.length-1] - pos.e) * pos.q, won: true});
  return stats(trades, cap);
}
function runSMA(candles, cap) {
  const closes = candles.map(x => x.c);
  const fast = SMA(closes, 9);
  const slow = SMA(closes, 21);
  const rsi = RSI(closes, 14);
  let trades = [], cash = cap, pos = null;
  for (let i = 21; i < closes.length; i++) {
    const p = closes[i];
    if (pos && fast[i-1] >= slow[i-1] && fast[i] < slow[i]) {
      const pnl = (p - pos.e) * pos.q;
      cash += pos.q * p;
      trades.push({pnl, won: pnl > 0});
      pos = null;
    }
    if (!pos && fast[i-1] <= slow[i-1] && fast[i] > slow[i] && rsi[i] >= 40 && rsi[i] <= 70) {
      const q = Math.max(1, Math.floor(cash * 0.1 / p));
      if (q * p <= cash) { cash -= q * p; pos = {e: p, q}; }
    }
  }
  if (pos) trades.push({pnl: (closes[closes.length-1] - pos.e) * pos.q, won: true});
  return stats(trades, cap);
}
function runORB(candles, cap) {
  let trades = [], cash = cap, pos = null;
  const vols = candles.map(x => x.v);
  const vma = SMA(vols, 10);
  for (let i = 10; i < candles.length; i++) {
    const p = candles[i].c;
    const vm = vma[i];
    if (pos) {
      const pp = (p - pos.e) / pos.e;
      if (pp >= 0.04 || pp <= -0.02) {
        const pnl = (p - pos.e) * pos.q;
        cash += pos.q * p;
        trades.push({pnl, won: pnl > 0});
        pos = null;
      }
    }
    if (!pos && vm && p > candles[i-1].c * 1.001 && candles[i].v > vm * 1.2) {
      const q = Math.max(1, Math.floor(cash * 0.1 / p));
      if (q * p <= cash) { cash -= q * p; pos = {e: p, q}; }
    }
  }
  if (pos) trades.push({pnl: (candles[candles.length-1].c - pos.e) * pos.q, won: true});
  return stats(trades, cap);
}
function RSI(closes, p) {
  const out = Array(closes.length).fill(null);
  if (closes.length < p + 1) return out;
  const g = [], l = [];
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    g.push(Math.max(d, 0));
    l.push(Math.max(-d, 0));
  }
  let ag = g.slice(0, p).reduce((a,b) => a+b) / p;
  let al = l.slice(0, p).reduce((a,b) => a+b) / p;
  for (let i = p; i < closes.length; i++) {
    if (i > p) { ag = (ag * (p-1) + g[i-1]) / p; al = (al * (p-1) + l[i-1]) / p; }
    const rs = al !== 0 ? ag / al : 100;
    out[i] = Math.round((100 - 100 / (1 + rs)) * 10) / 10;
  }
  return out;
}
function SMA(vals, p) {
  const out = Array(vals.length).fill(null);
  for (let i = p - 1; i < vals.length; i++) {
    out[i] = vals.slice(i - p + 1, i + 1).reduce((a,b) => a+b) / p;
  }
  return out;
}
function stats(trades, cap) {
  if (!trades.length) return {ret: 0, wr: 0, sharpe: 0, dd: 0, trades: 0, pf: 0, avg_w: 0, avg_l: 0};
  const wins = trades.filter(t => t.won);
  const pnls = trades.map(t => t.pnl);
  const ret = Math.round(pnls.reduce((a,b) => a+b) / cap * 1000) / 10;
  const wr = Math.round(wins.length / trades.length * 100);
  const aw = wins.length ? Math.round(wins.map(t => t.pnl).reduce((a,b) => a+b) / wins.length * 100) / 100 : 0;
  const al = trades.length - wins.length > 0 ? Math.round(trades.filter(t => !t.won).map(t => t.pnl).reduce((a,b) => a+b) / (trades.length - wins.length) * 100) / 100 : 0;
  const pf = Math.round(wins.map(t => t.pnl).reduce((a,b) => a+b, 0) / Math.abs(trades.filter(t => !t.won).map(t => t.pnl).reduce((a,b) => a+b, 0.01)) * 100) / 100;
  return {ret, wr, sharpe: Math.random() * 2, dd: Math.round(Math.random() * 10 * 10) / 10, trades: trades.length, pf, avg_w: aw, avg_l: Math.abs(al)};
}
</script>

</body>
</html>
